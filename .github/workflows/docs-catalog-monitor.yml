name: Docs Catalog Monitor

on:
  schedule:
    - cron: "43 7 * * 1" # Monday 07:43 UTC (GitHub may start scheduled runs hours late)
  workflow_dispatch:

# One queue for every workflow that writes data/ (learn and docs syncs), so
# they never push at the same time and never race on data/status.json.
concurrency:
  group: learnsync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the script stops fetching after MAX_RUNTIME_MINUTES and still writes what it gathered
    permissions:
      contents: write
      issues: write
    env:
      HUB_DISPATCH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Start from the branch tip, not from the commit that triggered the run: the other sync
          # writes the same change files and may have pushed while this run waited in the queue.
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Sync Microsoft docs catalog cache
        id: sync
        env:
          QUARANTINE_REPORT_FILE: /tmp/docs-catalog-quarantine-report.md
          MAX_RUNTIME_MINUTES: "90"
        run: node scripts/docs-catalog-sync.mjs

      - name: Commit updated catalog cache
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(
            data/docs-catalog.json data/docs-catalog-invalid.json data/docs-sitemap-families.json
            data/docs-urls.txt data/docs-redirects.json data/status.json
          )
          # The change files (removed and moved links) ship with the data they were derived from.
          # This step also runs after a failed sync (!cancelled()), so only a path that exists is
          # staged: before the very first successful run there is nothing to add.
          for f in data/changes/removed.json data/changes/moved.json; do
            if [ -e "$f" ]; then paths+=("$f"); fi
          done
          bash scripts/commit-data.sh "Update Microsoft docs catalog cache" "${paths[@]}"

      - name: Create issue for newly quarantined URLs
        if: ${{ !cancelled() && steps.sync.outputs.new_quarantine_count != '' }}
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Docs Catalog: ${{ steps.sync.outputs.new_quarantine_count }} newly quarantined URL(s) — investigate & fix"
          content-filepath: /tmp/docs-catalog-quarantine-report.md
          labels: data

      # Optional: tell mscerts/hub that fresh data exists so its Learn URL check
      # runs right away instead of waiting for its own schedule. Needs a
      # HUB_DISPATCH_TOKEN secret (a token allowed to create repository
      # dispatch events on mscerts/hub); skipped when the secret is not set.
      - name: Notify the hub
        if: ${{ success() && env.HUB_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HUB_DISPATCH_TOKEN }}
        run: gh api repos/mscerts/hub/dispatches -f event_type=learnsync-synced -f "client_payload[source]=docs-catalog-monitor"

      # Stable title + comment-on-existing so a persistent failure produces one
      # issue with a comment per failed run, not a new issue every week.
      - name: Create or update issue on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Microsoft Docs Catalog Sync Failed"
          {
            echo "The scheduled docs sync failed. Likely causes: one or more Learn sitemap files could not be fetched"
            echo "(removal detection was disabled and previous data carried forward), the sitemaps returned far fewer URLs"
            echo "than last run (sanity abort, nothing written), a rate-limit storm stopped a fetch phase (everything gathered"
            echo "so far was still written), the github/docs clone failed, the duplicate-URL audit tripped, or the data push"
            echo "was rejected, or a change file (\`data/changes/removed.json\` or \`moved.json\`) is corrupt or has an"
            echo "unsupported schemaVersion (the run stops before any request rather than overwrite it)."
            echo "Broken URLs alone do not fail this job: they are quarantined into"
            echo "\`data/docs-catalog-invalid.json\` (see AGENTS.md). See the run log for the exact reason."
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/docs-catalog-error.md
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file /tmp/docs-catalog-error.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --label bug --body-file /tmp/docs-catalog-error.md
          fi
