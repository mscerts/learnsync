name: Docs Catalog Monitor

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: docs-catalog-monitor
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # sitemaps + capped page fetches (MAX_PAGE_FETCHES) + github/docs clone; well under this in a normal week
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Sync Microsoft docs catalog cache
        id: sync
        env:
          QUARANTINE_REPORT_FILE: /tmp/docs-catalog-quarantine-report.md
        run: node scripts/docs-catalog-sync.mjs

      - name: Commit updated catalog cache
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/docs-catalog.json data/docs-catalog-invalid.json data/docs-sitemap-families.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Microsoft docs catalog cache"
            git push
          fi

      - name: Create issue for newly quarantined URLs
        if: ${{ !cancelled() && steps.sync.outputs.new_quarantine_count != '' }}
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Docs Catalog: ${{ steps.sync.outputs.new_quarantine_count }} newly quarantined URL(s) — investigate & fix"
          content-filepath: /tmp/docs-catalog-quarantine-report.md
          labels: data

      # Stable title + comment-on-existing so a persistent failure produces one
      # issue with a comment per failed run, not a new issue every week.
      - name: Create or update issue on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Microsoft Docs Catalog Sync Failed"
          {
            echo "The scheduled sync of \`data/docs-catalog.json\` failed: one or more Learn sitemap"
            echo "files could not be fetched, the sitemaps returned far fewer URLs than last run (sanity"
            echo "abort), the github/docs clone failed, or the duplicate-URL audit tripped. Previous"
            echo "entries were carried forward where possible."
            echo "Broken URLs alone don't fail this job -- they're quarantined into"
            echo "\`data/docs-catalog-invalid.json\` instead (see AGENTS.md)."
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/docs-catalog-error.md
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file /tmp/docs-catalog-error.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --label bug --body-file /tmp/docs-catalog-error.md
          fi
