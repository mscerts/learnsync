name: Module Links Monitor

on:
  schedule:
    - cron: "41 8 * * 1" # Monday 08:41 UTC, after the Learn and docs syncs (GitHub may start scheduled runs hours late)
  workflow_dispatch:

# One queue for every workflow that writes data/ (learn, docs and module-links syncs), so
# they never push at the same time and never race on data/status.json.
concurrency:
  group: learnsync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # a first run fetches ~1,400 unit pages and live-checks ~850 links at 3 polite workers (about 25 minutes); scope "all" would take roughly twice that; later runs only the changed modules
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Start from the branch tip, not from the commit that triggered the run: the other syncs
          # write data/status.json and may have pushed while this run waited in the queue.
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Harvest the links of the last unit of the Learn modules
        run: npm run sync:module-links

      - name: Commit updated module links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/status.json)
          # Only a path that exists is staged, so a first run that fails before writing cannot
          # break the commit step with an unknown pathspec.
          if [ -e data/module-links.json ]; then paths+=(data/module-links.json); fi
          bash scripts/commit-data.sh "Update Microsoft Learn module links cache" "${paths[@]}"

      # Stable title + comment-on-existing so a persistent failure produces one
      # issue with a comment per failed run, not a new issue every week.
      - name: Create or update issue on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Microsoft Learn Module Links Sync Failed"
          {
            echo "The scheduled module links sync failed (\`data/module-links.json\`)."
            echo "Likely causes: Learn's unit pages could not be read (rate limiting or an outage), Learn changed the markup of the"
            echo "last unit of a module so no links could be found, the links of far fewer modules than before were found, or"
            echo "\`data/learn-catalog.json\` / \`data/learn-content.json\` is missing or stale. A failsafe aborted the run, so nothing"
            echo "bad was written, or the data push was rejected. See the run log for the exact reason."
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/module-links-error.md
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file /tmp/module-links-error.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --label bug --body-file /tmp/module-links-error.md
          fi
