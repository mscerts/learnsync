name: Learn Catalog Monitor

on:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: learn-catalog-monitor
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Sync Microsoft Learn catalog cache
        run: node scripts/learn-catalog-sync.mjs

      - name: Commit updated catalog cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learn-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Microsoft Learn catalog cache"
            git push
          fi

      # Stable title + comment-on-existing so a persistent failure produces one
      # issue with a comment per failed run, not a new issue every week.
      - name: Create or update issue on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Microsoft Learn Catalog Sync Failed"
          {
            echo "The scheduled sync of \`data/learn-catalog.json\` failed."
            echo "The Microsoft Learn catalog API may be down, or its response schema may have changed."
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/learn-catalog-error.md
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file /tmp/learn-catalog-error.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --label bug --body-file /tmp/learn-catalog-error.md
          fi
