name: Learn Catalog Monitor

on:
  schedule:
    - cron: "17 7 * * 1" # Monday 07:17 UTC (GitHub may start scheduled runs hours late)
  workflow_dispatch:

# One queue for every workflow that writes data/ (learn and docs syncs), so
# they never push at the same time and never race on data/status.json.
concurrency:
  group: learnsync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # catalog + incremental unit URLs (a first or monthly full refresh is ~3,400 polite requests) + study-guide probes
    permissions:
      contents: write
      issues: write
    env:
      HUB_DISPATCH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Sync Microsoft Learn catalog caches
        run: npm run sync:learn

      - name: Commit updated catalog caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/learn-catalog.json data/learn-content.json data/status.json)
          # The change files (removed and moved links) ship with the data they were derived from.
          # Every successful sync writes them; only a path that exists is staged, so a first run
          # that fails before writing cannot break the commit step with an unknown pathspec.
          for f in data/changes/removed.json data/changes/moved.json; do
            if [ -e "$f" ]; then paths+=("$f"); fi
          done
          bash scripts/commit-data.sh "Update Microsoft Learn catalog cache" "${paths[@]}"

      # Optional: tell mscerts/hub that fresh data exists so its Learn URL check
      # runs right away instead of waiting for its own schedule. Needs a
      # HUB_DISPATCH_TOKEN secret (a token allowed to create repository
      # dispatch events on mscerts/hub); skipped when the secret is not set.
      - name: Notify the hub
        if: ${{ success() && env.HUB_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HUB_DISPATCH_TOKEN }}
        run: gh api repos/mscerts/hub/dispatches -f event_type=learnsync-synced -f "client_payload[source]=learn-catalog-monitor"

      # Stable title + comment-on-existing so a persistent failure produces one
      # issue with a comment per failed run, not a new issue every week.
      - name: Create or update issue on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Microsoft Learn Catalog Sync Failed"
          {
            echo "The scheduled Learn sync failed (\`data/learn-catalog.json\`, \`data/learn-content.json\`, \`data/changes/\`)."
            echo "Likely causes: the Learn catalog or hierarchy API is down or changed shape, a failsafe aborted the run"
            echo "(a sharp drop in modules, a missing category, too many failed unit-URL requests) so nothing bad was written,"
            echo "a change file (\`data/changes/removed.json\` or \`moved.json\`) is corrupt or has an unsupported schemaVersion"
            echo "(the run stops before any download rather than overwrite it), or the data push was rejected."
            echo "Nothing was committed. See the run log for the exact reason."
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/learn-catalog-error.md
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file /tmp/learn-catalog-error.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --label bug --body-file /tmp/learn-catalog-error.md
          fi
