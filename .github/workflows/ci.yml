name: CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths:
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check script syntax
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs test/*.mjs; do
            node --check "$f"
          done
          bash -n scripts/commit-data.sh

      - name: Run unit tests
        run: npm test

      # The syntax check above and `npm test` already cover scripts/check-changes.mjs, its library and
      # test/check-changes.test.mjs (they match the globs). This also runs the CLI as a real process on
      # the committed data/: exit 1 means a change file under data/changes/ is unreadable (missing files
      # are fine, they only produce warnings).
      - name: Smoke-test the change-file CLI
        run: |
          node scripts/check-changes.mjs --help > /dev/null
          node scripts/check-changes.mjs --since 2000-01-01 > /dev/null

      - name: Validate package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf-8')); console.log('package.json: OK')"

      # actionlint understands workflow semantics (bad if: expressions, wrong step
      # outputs, invalid cron) -- much stronger than a bare YAML parse.
      - name: Lint workflows with actionlint
        run: |
          # download script pinned to the commit of tag v1.7.12 (a tag can move, a commit cannot)
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      # Issue templates aren't workflows, so actionlint doesn't cover them -- a plain
      # YAML parse still catches broken template syntax.
      - name: Validate issue-template YAML
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          ok = True
          files = sorted(glob.glob(".github/ISSUE_TEMPLATE/*.yml") + [".github/dependabot.yml"])
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
                  print(f"{f}: OK")
              except Exception as e:
                  print(f"{f}: ERROR {e}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
